name: CI

# Validate the legacy cloth-recyclability GUI without launching Tkinter in CI.
# The application is desktop-only, so CI focuses on parser/import safety and
# dependency installation rather than pretending a headless runner is a GUI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Match the project's declared Poetry runtime constraint. The CI does not
      # execute the GUI because Tk/desktop display behavior requires a workstation.
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry<2"
          poetry install --no-root --no-interaction

      # Catch syntax errors without importing Tkinter or opening windows.
      - name: Validate Python syntax
        run: python -m compileall -q cloth_recyclability_gui.py
